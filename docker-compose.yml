services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - 1972
      - 57337:52773
      - 53773
    volumes:
      - ./:/home/irisowner/dev
